name: Auto Merge PR for New Year

on:
  schedule:
    # UTC 时间 2025-12-31 15:59:00 (北京时间 2025-12-31 23:59:00)
    - cron: '59 15 31 12 *'
  
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test mode (dry run)'
        required: false
        default: 'false'

jobs:
  merge-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
      
      - name: Checkout with PR
        uses: actions/checkout@v4
        with:
          ref: refs/pull/1504/head
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Merge to main (Simulate)
        run: |
          # 获取当前时间（用于日志）
          echo "Current UTC time: $(date)"
          echo "Current Beijing time: $(TZ=Asia/Shanghai date)"
          
          # 如果是测试模式，只显示信息
          if [ "${{ github.event.inputs.test_mode }}" = "true" ]; then
            echo "🔍 TEST MODE: Would merge PR #1504 now"
            echo "PR URL: https://github.com/${{ github.repository }}/pull/1504"
            exit 0
          fi
          
          # 实际的合并操作
          echo "🔄 Merging PR #1504..."
          
          # 方法1：使用 GitHub API 直接合并
          RESPONSE=$(curl -s -X PUT \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            -d '{
              "commit_title": "🎊 Happy New Year",
              "commit_message": "Happy New Year 2026!\n\nCo-authored-by: VeryrrDefine <veryrrdefine@users.noreply.github.com>\nCo-authored-by: 0i00000000a7 <0i00000000a7@users.noreply.github.com>\nCo-authored-by: seanxlx2011 <seanxlx2011@users.noreply.github.com>",
              "merge_method": "merge"
            }' \
            "https://api.github.com/repos/${{ github.repository }}/pulls/1504/merge" 2>&1)
          
          if echo "$RESPONSE" | grep -q "merged"; then
            echo "✅ PR #1504 已成功合并！"
            echo "🕐 更新时间: 2026-01-01 00:00:00 (北京时间)"
          else
            echo "❌ 合并失败，可能是 PR 已合并或不可合并"
            echo "响应: $RESPONSE"
            exit 1
          fi
